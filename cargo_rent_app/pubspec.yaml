name: cargo_rent_app
description: "A professional car rental marketplace application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.3.1  # Added to fix Admin Dashboard errors

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # If you add assets like logos later, they go here:
  # assets:
  #   - assets/images/logo.png